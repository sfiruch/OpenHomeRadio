name: .NET

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  checks: write
  id-token: write

jobs:
  test:
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Build
      run: dotnet build -c Release
    - name: Test
      run: dotnet test -c Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
    - name: Test Report
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Test Results (${{ matrix.os }})
        path: "**/test-results.trx"
        reporter: dotnet-trx

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Get Version
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      shell: bash
    - name: Test
      run: dotnet test -c Release
    - name: Pack
      run: |
        dotnet pack OpenHomeRadio/OpenHomeRadio.csproj -c Release -o out -p:Version=${{ steps.get_version.outputs.VERSION }}
        dotnet pack OpenHomeRadio.Cli/OpenHomeRadio.Cli.csproj -c Release -o out -p:Version=${{ steps.get_version.outputs.VERSION }}
    - name: NuGet login (OIDC)
      uses: NuGet/login@v1
      id: login
      with:
        user: sfiruch
    - name: Push
      run: dotnet nuget push "out/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
